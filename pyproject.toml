[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-hub"
version = "0.1.1"
description = "Multi-Agent & Multi-Provider Control Hub for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Hermes Development Team" }
]
keywords = [
    "hermes",
    "router",
    "multi-provider",
    "antigravity",
    "codex",
    "opencode",
    "agentic-ai",
    "cockpit",
    "hub"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "ruff>=0.3.0",
]
legacy = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
hermes-hub = "antigravity_provider.router.cli_commands:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-m 'not live and not network'"
markers = [
    "unit: Unit tests that run isolated in-memory",
    "integration: Component integration tests with isolated filesystem",
    "network: Tests that perform real network calls",
    "installer: Tests verifying installer and packaging",
    "live: End-to-end tests requiring real user credentials",
]
